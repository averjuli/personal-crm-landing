# Shared site configuration; preserve the app and default servers when updating.

# Unknown hosts and requests by bare IP: close the connection without an answer
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name vupsen.space;
    server_tokens off;

    # Let's Encrypt domain checks (also needed for renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name app.vupsen.space;

    # Let's Encrypt domain checks (also needed for renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# TLS protocol versions are negotiated before the host is known, so they come from this server
server {
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
    include snippets/tls.conf;
}

server {
    listen 443 ssl http2;
    server_name vupsen.space;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/vupsen.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vupsen.space/privkey.pem;
    include snippets/tls.conf;

    # Keep HSTS scoped to this host; app subdomains manage their own policy.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Astro also embeds small font subsets as data URLs in the inline CSS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    root /var/www/vupsen.space;
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    server_name app.vupsen.space;

    ssl_certificate     /etc/letsencrypt/live/vupsen.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vupsen.space/privkey.pem;
    include snippets/tls.conf;

    # The app in Docker, see /opt/personal-crm
    include snippets/personal-crm-app.conf;
}
